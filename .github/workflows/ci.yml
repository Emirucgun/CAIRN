name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  perf:
    # v0.1 acceptance: cairn map on 10,000 files, < 5 s cold, < 1 s warm.
    # Gated on Linux. macOS runs report-only: its runner is ~8x slower at
    # small-file I/O (building the fixture: 13 s vs 1.7 s on Linux).
    # Separate job so a slow runner never makes unit tests flaky.
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            report_only: ""
          - os: macos-latest
            report_only: "1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm perf
        env:
          CAIRN_PERF_REPORT_ONLY: ${{ matrix.report_only }}
