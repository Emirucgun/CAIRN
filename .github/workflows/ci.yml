name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  perf:
    # v0.1 acceptance: cairn map on 10,000 files, < 5 s cold, < 1 s warm,
    # each judged on the median of 3 samples (runner speed varies over 60%).
    # Limits scale with the fixture build time (no CAIRN code) against a
    # normal Linux runner: never tighter, at most x2 (see scripts/perf.ts).
    # Gated on Linux only. macOS and Windows run report-only: they check that
    # the benchmark works there and show the numbers, but never fail (the
    # macOS runner is ~8x slower at small-file I/O than Linux).
    # Separate job so a slow runner never makes unit tests flaky.
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            report_only: ""
          - os: macos-latest
            report_only: "1"
          - os: windows-latest
            report_only: "1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm perf
        env:
          CAIRN_PERF_REPORT_ONLY: ${{ matrix.report_only }}
